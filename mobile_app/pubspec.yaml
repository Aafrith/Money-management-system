name: money_manager
description: "Smart Money Manager - Track and manage your expenses"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP & Networking
  dio: ^5.4.3+1

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # Charts
  fl_chart: ^0.70.2

  # UI Enhancements
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # Image Picker (for receipt scanning)
  image_picker: ^1.1.2

  # Date/Currency Formatting
  intl: ^0.19.0

  # Permissions and Path
  permission_handler: ^11.3.1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Speech to Text (custom git dependency)
  speech_to_text:
    git:
      url: https://github.com/csdcorp/speech_to_text.git
      path: speech_to_text
      ref: main

  # SMS Listening
  telephony: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
